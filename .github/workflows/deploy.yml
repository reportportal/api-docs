name: Deploy to prod (GitHub Pages)
env:
  BUILD_DIR : "build/"
  DOCS_BASE_URL: "/api-docs/"

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - README.md

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install of node dependencies
        run: npm ci

      - name: create env file
        run: |
          touch .env
          echo DOCS_BASE_URL=${{ env.DOCS_BASE_URL }} >> .env

      - name: Build the OpenAPI documentation
        run: npm run gen-all

      - name: Build the source code
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ env.BUILD_DIR }}
          publish_branch: gh-pages
          commit_message: ${{ github.event.head_commit.message }}

  merge-to-develop:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Merge main into develop and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git fetch origin develop:develop 2>/dev/null; then
            echo "::warning::develop branch not found, skipping merge."
            exit 0
          fi
          if git diff --quiet develop..main; then
            echo "No differences between main and develop, skipping merge."
            exit 0
          fi
          git checkout develop
          if ! git merge --no-ff main -m "Sync || merge main into develop"; then
            echo "::error::Merge conflict detected when merging main into develop."
            git merge --abort
            exit 1
          fi
          git push origin develop
